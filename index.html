<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استمارة المعلومات الشخصية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #bbb;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.info {
    text-align: center;
    margin-bottom: 20px;
    font-weight: bold;
    line-height: 2;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
    border: 1px solid #aaa;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.edit {
    background: #ffc107;
}

.print {
    background: #17a2b8;
    color: white;
}

.send {
    background: #28a745;
    color: white;
}
</style>

</head>

<body>

<div class="container">

<h1>استمارة المعلومات الشخصية</h1>

<div class="info">

    التسلسل:
    <span id="serial">1</span>

    <br>

    التاريخ والوقت:
    <span id="datetime"></span>

</div>


<form id="myForm">

    <input
        type="hidden"
        name="التسلسل"
        id="hidden_serial"
    >

    <input
        type="hidden"
        name="تاريخ ووقت الإرسال"
        id="hidden_datetime"
    >


    <label>الرتبة</label>
    <input type="text" name="الرتبة" required>


    <label>الرقم الإحصائي</label>
    <input type="text" name="الرقم الإحصائي" required>


    <label>الصنف</label>
    <input type="text" name="الصنف">


    <label>الاسم الكامل واللقب</label>
    <input type="text" name="الاسم الكامل واللقب" required>


    <label>اسم الأم الثلاثي</label>
    <input type="text" name="اسم الأم الثلاثي">


    <label>اسم الزوجة</label>
    <input type="text" name="اسم الزوجة">


    <label>عدد الأطفال</label>
    <input type="number" name="عدد الأطفال" min="0">


    <label>محل الولادة</label>
    <input type="text" name="محل الولادة">


    <label>تاريخ التولد</label>
    <input type="date" name="تاريخ التولد">


    <label>عنوان السكن الحالي</label>
    <input type="text" name="عنوان السكن الحالي">


    <label>أقرب نقطة دالة</label>
    <input type="text" name="أقرب نقطة دالة">


    <label>أمر التعيين</label>
    <input type="text" name="أمر التعيين">


    <label>تاريخ أمر التعيين</label>
    <input type="date" name="تاريخ أمر التعيين">


    <label>أمر الترقية</label>
    <input type="text" name="أمر الترقية">


    <label>تاريخ أمر الترقية</label>
    <input type="date" name="تاريخ أمر الترقية">


    <label>اسم المختار</label>
    <input type="text" name="اسم المختار">


    <label>رقم الهاتف</label>
    <input type="tel" name="رقم الهاتف">


    <button
        type="button"
        class="edit"
        onclick="enableEdit()">
        ✏️ تعديل الاستمارة
    </button>


    <button
        type="button"
        class="print"
        onclick="window.print()">
        🖨️ طباعة الاستمارة
    </button>


    <button
        type="submit"
        class="send"
        id="submitBtn">
        📤 إرسال الاستمارة
    </button>

</form>

</div>


<script>

/* ==========================================
   التسلسل
   ========================================== */

let serial = Number(
    localStorage.getItem("serial") || 1
);

document.getElementById("serial").textContent =
    serial;

document.getElementById("hidden_serial").value =
    serial;


/* ==========================================
   التاريخ والوقت
   ========================================== */

function updateDateTime() {

    const now = new Date();

    const timeString =
        now.toLocaleString("ar-IQ");

    document.getElementById("datetime")
        .textContent = timeString;

    document.getElementById("hidden_datetime")
        .value = timeString;
}

updateDateTime();

setInterval(updateDateTime, 1000);


/* ==========================================
   زر التعديل
   ========================================== */

function enableEdit() {

    document
        .querySelectorAll("input")
        .forEach(function(input) {

            input.disabled = false;

        });

    alert("✅ الاستمارة أصبحت قابلة للتعديل");
}


/* ==========================================
   إرسال البيانات إلى api.php
   ========================================== */

document
    .getElementById("myForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        updateDateTime();

        const form = e.target;

        const button =
            document.getElementById("submitBtn");

        button.disabled = true;

        button.textContent =
            "⏳ جاري الحفظ...";


        try {

            /*
             * جمع بيانات الاستمارة
             */

            const formData =
                new FormData(form);


            /*
             * إرسال البيانات إلى api.php
             */

            const response =
                await fetch("api.php", {

                    method: "POST",

                    body: formData

                });


            /*
             * التأكد من نجاح الاتصال
             */

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );
            }


            /*
             * قراءة رد PHP
             */

            const result =
                await response.json();


            console.log(
                "رد api.php:",
                result
            );


            /*
             * إذا تم الحفظ
             */

            if (result.success === true) {

                alert(
                    "✅ " + result.message
                );


                /*
                 * زيادة التسلسل
                 */

                serial++;

                localStorage.setItem(
                    "serial",
                    serial
                );


                /*
                 * تنظيف الاستمارة
                 */

                form.reset();


                /*
                 * تحديث التسلسل
                 */

                document.getElementById(
                    "serial"
                ).textContent = serial;


                document.getElementById(
                    "hidden_serial"
                ).value = serial;


                updateDateTime();

            }

            else {

                alert(
                    "❌ لم يتم حفظ البيانات\n\n" +
                    result.message
                );
            }

        }

        catch (error) {

            console.error(error);

            alert(
                "❌ حدث خطأ في الاتصال\n\n" +
                error.message +
                "\n\nتأكد أن api.php موجود بجانب index.html"
            );
        }


        finally {

            button.disabled = false;

            button.textContent =
                "📤 إرسال الاستمارة";
        }

    });

</script>

</body>
</html>

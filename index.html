<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استمارة المعلومات الشخصية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Tahoma, sans-serif;
    background: #eaf4ff;
    color: #222;
}

.header {
    background: #1976d2;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-radius: 0 0 20px 20px;
    margin: -15px -15px 20px -15px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.form-box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 15px;
    border: 1px solid #bbb;
    border-radius: 15px;
    font-size: 18px;
    font-family: inherit;
    background: #f8fbff;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #1976d2;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 18px;
    font-size: 21px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
}

.edit-btn {
    background: #ffc107;
    color: #222;
}

.submit-btn {
    background: #2e7d32;
    color: white;
}

.submit-btn:disabled {
    opacity: 0.6;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
}

.success {
    display: block;
    background: #d4edda;
    color: #155724;
}

.error {
    display: block;
    background: #f8d7da;
    color: #721c24;
}

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    .form-box {
        padding: 18px;
    }

    .header h1 {
        font-size: 23px;
    }

    label {
        font-size: 17px;
    }

    input,
    textarea {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>📋 استمارة المعلومات الشخصية</h1>

</div>

        <input

            required
        >
    </div>


    <!-- 10 -->
    <div class="field">
        <label>عنوان السكن الحالي</label>

        <textarea

            required
        ></textarea>
    </div>

        <label>أقرب نقطة دالة</label>

        <input

            name="أقرب_نقطة_دالة"
            required
        >
    </div>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f5f9;
    color: #222;
}

.header {
    background: #0d6efd;
    color: white;
    text-align: center;
    padding: 22px 10px;

.header h1 {

.form-box {

    padding: 25px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.serial {
    background: #e8f1ff;
    border: 1px solid #b8d4ff;

    font-family: inherit;

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #0d6efd;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.info-box {

}

.info-item {

    text-align: center;
    font-size: 14px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

    flex: 1;
    border: none;
    padding: 14px;
    border-radius: 9px;
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
}

    background: #ffc107;
    color: #222;
}

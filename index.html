<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة المعلومات الشخصية</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:15px;}
.container{max-width:700px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #bbb;}
h1{text-align:center;margin-bottom:10px;}
.info{text-align:center;margin-bottom:20px;font-weight:bold;}
label{display:block;margin-top:12px;font-weight:bold;}
input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #aaa;border-radius:7px;font-size:16px;}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:8px;font-size:17px;cursor:pointer;}
.edit{background:#ffc107;}
.print{background:#17a2b8;color:white;}
.send{background:#28a745;color:white;}
</style>
</head>
<body>

<div class="container">
<h1>استمارة المعلومات الشخصية</h1>
<div class="info">
    التسلسل: <span id="serial">1</span><br>
    التاريخ والوقت: <span id="datetime"></span>
</div>

<form id="myForm">
<input type="hidden" name="التسلسل" id="hidden_serial">
<input type="hidden" name="تاريخ ووقت الإرسال" id="hidden_datetime">

<label>الرتبة</label> <input type="text" name="الرتبة" required>
<label>الرقم الإحصائي</label> <input type="text" name="الرقم الإحصائي" required>
<label>الصنف</label> <input type="text" name="الصنف">
<label>الاسم الكامل واللقب</label> <input type="text" name="الاسم الكامل واللقب" required>
<label>اسم الأم الثلاثي</label> <input type="text" name="اسم الأم الثلاثي">
<label>اسم الزوجة</label> <input type="text" name="اسم الزوجة">
<label>عدد الأطفال</label> <input type="number" name="عدد الأطفال">
<label>محل الولادة</label> <input type="text" name="محل الولادة">
<label>تاريخ التولد</label> <input type="date" name="تاريخ التولد">
<label>عنوان السكن الحالي</label> <input type="text" name="عنوان السكن الحالي">
<label>أقرب نقطة دالة</label> <input type="text" name="أقرب نقطة دالة">
<label>أمر التعيين</label> <input type="text" name="أمر التعيين">
<label>تاريخ أمر التعيين</label> <input type="date" name="تاريخ أمر التعيين">
<label>أمر الترقية</label> <input type="text" name="أمر الترقية">
<label>تاريخ أمر الترقية</label> <input type="date" name="تاريخ أمر الترقية">
<label>اسم المختار</label> <input type="text" name="اسم المختار">
<label>رقم الهاتف</label> <input type="tel" name="رقم الهاتف">

<button type="button" class="edit" onclick="enableEdit()">✏️ تعديل الاستمارة</button>
<button type="button" class="print" onclick="window.print()">🖨️ طباعة الاستمارة</button>
<button type="submit" class="send" id="submitBtn">📤 إرسال الاستمارة</button>
</form>
</div>

<script>
// ⚠️ ضع هنا رابط الـ Web App الجديد والنشط الذي استخرجته للتو
const SCRIPT_URL = "ضع_الرابط_الجديد_هنا";

let serial = Number(localStorage.getItem("serial") || 1);
document.getElementById("serial").textContent = serial;
document.getElementById("hidden_serial").value = serial;

function updateDateTime(){
    const now = new Date();
    const timeString = now.toLocaleString("ar-IQ");
    document.getElementById("datetime").textContent = timeString;
    document.getElementById("hidden_datetime").value = timeString;
}
updateDateTime();
setInterval(updateDateTime, 1000);

function enableEdit(){
    document.querySelectorAll("input").forEach(input=>{ input.disabled = false; });
    alert("الاستمارة أصبحت قابلة للتعديل");
}

document.getElementById("myForm").addEventListener("submit", function(e){
    e.preventDefault();
    updateDateTime();
    
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "جاري الحفظ والإرسال لوحدة الطبابة...";

    const form = e.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key)=>{ data[key] = value; });

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // لتجنب حظر CORS نهائياً من المتصفح
        headers: {
            "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
    }).then(() => {
        alert("✅ تم حفظ الاستمارة بنجاح وظهرت في جدول البيانات الرئيسي!");
        serial++;
        localStorage.setItem("serial", serial);
        form.reset();
        document.getElementById("serial").textContent = serial;
        document.getElementById("hidden_serial").value = serial;
        updateDateTime();
    }).catch(error => {
        alert("❌ فشل الاتصال بالسيرفر");
        console.error(error);
    }).finally(() => {
        btn.disabled = false;
        btn.textContent = "📤 إرسال الاستمارة";
    });
});
</script>
</body>
</html>

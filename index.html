<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة المعلومات الشخصية</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:15px;}
.container{max-width:700px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #bbb;}
h1{text-align:center;margin-bottom:10px;}
.info{text-align:center;margin-bottom:20px;font-weight:bold;}
label{display:block;margin-top:12px;font-weight:bold;}
input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #aaa;border-radius:7px;font-size:16px;}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:8px;font-size:17px;cursor:pointer;}
.edit{background:#ffc107;}
.print{background:#17a2b8;color:white;}
.send{background:#28a745;color:white;}
</style>
</head>
<body>

<div class="container">
<h1>استمارة المعلومات الشخصية</h1>
<div class="info">
    التسلسل: <span id="serial">1</span><br>
    التاريخ والوقت: <span id="datetime"></span>
</div>

<!-- تم ربط الفورم برابط نموذج جوجل مباشرة واستخراج المعرفات الخاصة بالخانات -->
<form id="myForm" action="https://google.com" method="POST" target="hidden_iframe" onsubmit="submitted=true;">

<label>الرتبة</label> 
<input type="text" name="entry.2036494793" required>

<label>الرقم الإحصائي</label> 
<input type="text" name="entry.1481585250" required>

<label>الصنف</label> 
<input type="text" name="entry.1594242636" required>

<label>الاسم الكامل واللقب</label> 
<input type="text" name="entry.180295831" required>

<label>اسم الأم الثلاثي</label> 
<input type="text" name="entry.1691230009">

<label>اسم الزوجة</label> 
<input type="text" name="entry.1114515286">

<label>عدد الأطفال</label> 
<input type="number" name="entry.607421160">

<label>محل الولادة</label> 
<input type="text" name="entry.1045952953" required>

<label>تاريخ التولد</label> 
<input type="date" name="entry.396347065" required>

<label>عنوان السكن الحالي</label> 
<input type="text" name="entry.1425126860" required>

<label>أقرب نقطة دالة</label> 
<input type="text" name="entry.209675200" required>

<label>أمر التعيين</label> 
<input type="text" name="entry.2078696882" required>

<label>تاريخ أمر التعيين</label> 
<input type="date" name="entry.1643445831" required>

<label>أمر آخر ترقية</label> 
<input type="text" name="entry.1610427387" required>

<label>تاريخ أمر الترقية</label> 
<input type="date" name="entry.154562092" required>

<label>اسم المختار</label> 
<input type="text" name="entry.367098677" required>

<label>رقم الهاتف</label> 
<input type="tel" name="entry.1189332204" required>

<button type="button" class="edit" onclick="enableEdit()">✏️ تعديل الاستمارة</button>
<button type="button" class="print" onclick="window.print()">🖨️ طباعة الاستمارة</button>
<button type="submit" class="send" id="submitBtn">📤 إرسال الاستمارة</button>
</form>
</div>

<!-- آيفريم مخفي لاستقبال رد جوجل ومنع فتح صفحة جوجل القبيحة عند الإرسال -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { handleResponse(); }"></iframe>

<script>
let submitted = false;
let serial = Number(localStorage.getItem("serial") || 1);
document.getElementById("serial").textContent = serial;

function updateDateTime(){
    const now = new Date();
    document.getElementById("datetime").textContent = now.toLocaleString("ar-IQ");
}
updateDateTime();
setInterval(updateDateTime, 1000);

function enableEdit(){
    document.querySelectorAll("input").forEach(input=>{ input.disabled = false; });
    alert("الاستمارة أصبحت قابلة للتعديل");
}

function handleResponse() {
    alert("✅ تم إرسال الاستمارة بنجاح إلى قاعدة بيانات الطبابة وتحديث الجدول!");
    serial++;
    localStorage.setItem("serial", serial);
    document.getElementById("serial").textContent = serial;
    document.getElementById("myForm").reset();
    submitted = false;
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "📤 إرسال الاستمارة";
}

document.getElementById("myForm").addEventListener("submit", function() {
    document.getElementById("submitBtn").disabled = true;
    document.getElementById("submitBtn").textContent = "جاري الحفظ والارسال...";
});
</script>
</body>
</html>

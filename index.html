<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استمارة المعلومات</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Tahoma, sans-serif;
    background: #eaf4ff;
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
}

.header {
    background: #1976d2;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.header .icon {
    font-size: 45px;
    margin-bottom: 8px;
}

.header h1 {
    font-size: 21px;
    margin: 5px 0;
}

.header p {
    font-size: 14px;
    margin: 5px 0;
}

.field {
    margin-bottom: 12px;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    height: 52px;
    padding: 10px 14px;
    border: 1px solid #bbb;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    direction: rtl;
    outline: none;
}

input:focus {
    border: 2px solid #1565c0;
}

button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.edit {
    background: #ffc107;
    color: #000;
    margin-top: 8px;
}

.send {
    background: #2e7d32;
    color: white;
    margin-top: 12px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #d4edda;
    color: #155724;
}

.error {
    background: #f8d7da;
    color: #721c24;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">📋</div>

        <h1>استمارة المعلومات الشخصية</h1>

        <p>يرجى إدخال المعلومات بشكل صحيح</p>
    </div>


    <!-- ============================= -->
    <!-- الاستمارة -->
    <!-- ============================= -->

        <!-- Web3Forms Access Key -->
        <input

        >

        <!-- عنوان الرسالة -->
        <input
            type="hidden"
            name="subject"
            value="استمارة معلومات شخصية جديدة"

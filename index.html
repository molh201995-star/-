<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استمارة المعلومات الشخصية</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Tahoma, sans-serif;
    background: #eaf4ff;
    color: #222;
}

.header {
    background: #1976d2;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-radius: 0 0 20px 20px;
    margin: -15px -15px 20px -15px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.form-box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 15px;
    border: 1px solid #bbb;
    border-radius: 15px;
    font-size: 18px;
    font-family: inherit;
    background: #f8fbff;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #1976d2;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 18px;
    font-size: 21px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
}

.edit-btn {
    background: #ffc107;
    color: #222;
}

.submit-btn {
    background: #2e7d32;
    color: white;
}

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    .form-box {
        padding: 18px;
    }

    .header h1 {
        font-size: 23px;
    }

    label {
        font-size: 17px;
    }

    input,
    textarea {
        font-size: 17px;
    }

}

</style>
</head>


<body>


<div class="header">

    <h1>📋 استمارة المعلومات الشخصية</h1>

    <p>يرجى إدخال المعلومات بشكل صحيح</p>

</div>



<div class="form-box">


<form
    action="https://formspree.io/f/xeaoqdpo"
    method="POST"
>


<!-- عنوان الرسالة -->

<input
    type="hidden"
    name="_subject"
    value="استمارة معلومات شخصية جديدة"
>


<!-- 1 -->

<div class="field">

<label>الرتبة</label>

<input
    type="text"
    name="الرتبة"
    required
>

</div>



<!-- 2 -->

<div class="field">

<label>الرقم الإحصائي</label>

<input
    type="text"
    name="الرقم_الإحصائي"
    required
>

</div>



<!-- 3 -->

<div class="field">

<label>الصنف</label>

<input
    type="text"
    name="الصنف"
    required
>

</div>



<!-- 4 -->

<div class="field">

<label>الاسم الكامل واللقب</label>

<input
    type="text"
    name="الاسم_الكامل_واللقب"
    required
>

</div>



<!-- 5 -->

<div class="field">

<label>اسم الأم الثلاثي</label>

<input
    type="text"
    name="اسم_الأم_الثلاثي"
    required
>

</div>



<!-- 6 -->

<div class="field">

<label>اسم الزوجة</label>

<input
    type="text"
    name="اسم_الزوجة"
>

</div>



<!-- 7 -->

<div class="field">

<label>عدد الأطفال</label>

<input
    type="number"
    name="عدد_الأطفال"
    min="0"
>

</div>



<!-- 8 -->

<div class="field">

<label>محل الولادة</label>

<input
    type="text"
    name="محل_الولادة"
    required
>

</div>



<!-- 9 -->

<div class="field">

<label>تاريخ التولد</label>

<input
    type="date"
    name="تاريخ_التولد"
    required
>

</div>



<!-- 10 -->

<div class="field">

<label>عنوان السكن الحالي</label>

<textarea
    name="عنوان_السكن_الحالي"
    required
></textarea>

</div>



<!-- 11 -->

<div class="field">

<label>أقرب نقطة دالة</label>

<input
    type="text"
    name="أقرب_نقطة_دالة"
    required
>

</div>



<!-- 12 -->

<div class="field">

<label>أمر التعيين</label>

<input
    type="text"
    name="أمر_التعيين"
>

</div>



<!-- 13 -->

<div class="field">

<label>تاريخ أمر التعيين</label>

<input
    type="date"
    name="تاريخ_أمر_التعيين"
>

</div>



<!-- 14 -->

<div class="field">

<label>أمر الترقية</label>

<input
    type="text"
    name="أمر_الترقية"
>

</div>



<!-- 15 -->

<div class="field">

<label>تاريخ أمر الترقية</label>

<input
    type="date"
    name="تاريخ_أمر_الترقية"
>

</div>



<!-- 16 -->

<div class="field">

<label>اسم المختار</label>

<input
    type="text"
    name="اسم_المختار"
>

</div>



<!-- 17 -->

<div class="field">

<label>رقم الهاتف</label>

<input
    type="tel"
    name="رقم_الهاتف"
    inputmode="numeric"
    placeholder="07xxxxxxxxx"
    required
>

</div>



<!-- الأزرار -->

<div class="buttons">


<button
    type="button"
    class="edit-btn"
    onclick="enableEditing()"
>

✏️ تعديل الاستمارة

</button>



<button
    type="submit"
    class="submit-btn"
>

📤 إرسال الاستمارة

</button>


</div>


</form>


</div>



<script>

function enableEditing() {

    const fields =
        document.querySelectorAll(
            "input:not([type='hidden']), textarea"
        );

    fields.forEach(function(field) {

        field.disabled = false;

        field.readOnly = false;

    });

    alert("✏️ يمكنك الآن تعديل بيانات الاستمارة");

}

</script>


</body>

</html>
